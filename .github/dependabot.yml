# Weekly Dependabot updates: GitHub Actions and the test requirements (the integration itself has no pip deps).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
    # All lukislp/ci-workflows bumps share one PR, so they take one slot of the
    # limit and other actions (e.g. harden-runner) are not starved by them.
    groups:
      ci-workflows:
        patterns:
          - "lukislp/ci-workflows*"
      # init, analyze and upload-sarif must run the same version - one PR for all.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(deps)"
    # requirements_test.txt is a hash lock of pytest-homeassistant-custom-component, which pins
    # Home Assistant and everything Home Assistant pins (cryptography among them) exactly; a
    # security update Dependabot tries there can never resolve and only fails its job. These
    # move with the next Home Assistant pin instead.
    ignore:
      - dependency-name: cryptography
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
