# Weekly Dependabot updates: GitHub Actions and the test requirements (the integration itself has no pip deps).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(ci)"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
