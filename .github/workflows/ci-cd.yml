name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Test stage — runs on every push to main AND every pull request
  # ---------------------------------------------------------------------
  test-hacs-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Official HACS structural validation (hacs.json, manifest fields, etc.) - always
      # referenced by branch per HACS's own docs, since it validates against whatever
      # the current HACS requirements are, not a fixed historical ruleset. The brands
      # check now passes on its own: custom_components/studylife/brand/icon.png is
      # picked up directly (HA 2026.3+ brand proxy API), no home-assistant/brands PR needed.
      - uses: hacs/action@main
        with:
          category: integration

  test-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Home Assistant Core's own manifest/config-flow/translation validator - always
      # referenced by branch, same rationale as hacs/action above: validates against
      # whatever hassfest's current ruleset is, not a fixed historical pin.
      - uses: home-assistant/actions/hassfest@master

  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      # tests/test_openapi_contract.py (audit finding D2/D3) and tests/test_metrics_golden_
      # fixtures.py (audit finding D4) are a normal part of this `pytest tests/` run - they're
      # just two more modules under tests/. Called out here because they behave differently in
      # CI than the rest of the suite: each fetches a committed file from the studylife repo's
      # main branch (docs/api/openapi.json / docs/api/metrics-fixtures.json, via their own
      # default STUDYLIFE_OPENAPI_SPEC / STUDYLIFE_METRICS_FIXTURES URLs) and FAILS this job
      # (not skips) if that file is unreachable, or if this integration's api.py/coordinator.py
      # have drifted from it - see those modules' own docstrings for the full reachability
      # policy (CI vs. local/offline dev) and tests/_network_fetch.py for why they each need one
      # real outbound HTTPS request despite pytest-homeassistant-custom-component blocking
      # sockets by default for every other test in this suite.
      - run: pytest tests/ -v --cov=custom_components/studylife --cov-report=json:coverage.json
      # Self-hosted coverage badge (no external service), downloaded and committed by the
      # semantic-release job below - same pattern as the manifest-version sync.
      - run: python3 scripts/generate_coverage_badge.py coverage.json coverage-badge.json
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: coverage-badge.json
          retention-days: 7

  # ---------------------------------------------------------------------
  # Version / release — push to main only
  # ---------------------------------------------------------------------
  get-version:
    needs: [test-hacs-validation, test-hassfest, test-lint, test-unit]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: studylife-hacs-release-chain
      cancel-in-progress: false
    # @semantic-release/github's verifyConditions step checks the token has repo push access
    # (contents: write) even during a dry run - a read-only token fails that check outright.
    # issues:write/pull-requests:write are NOT needed here: those only get exercised by the
    # publish/success/fail lifecycle steps, which dry_run: true skips entirely - confirmed
    # live (2026-08-12, see studylife-ai's docs/decisions.md).
    permissions:
      contents: write
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v7
        with:
          # ref: main (branch tip), NOT the push-event SHA: "[skip ci]" commits can land on
          # main between the triggering push and this job actually running. semantic-release's
          # "local branch is behind the remote" guard then analyzes a stale SHA and releases
          # nothing - the entire release chain skips even though a releasable fix was just
          # merged. Analyzing the branch tip makes the verdict immune to that race.
          ref: main
          fetch-depth: 0
      - id: semrel
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/exec@7.1.0
            @semantic-release/github@12.0.9
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No release needed for this push
        if: steps.semrel.outputs.new_release_published != 'true'
        run: |
          echo "No releasable commits since the last tag (e.g. docs/ci/chore-only) - this is the expected, common case with Conventional Commits, not a failure. Downstream jobs below skip themselves via needs.get-version.outputs.published." | tee -a "$GITHUB_STEP_SUMMARY"

  semantic-release:
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: studylife-hacs-release-chain
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # ref: main for the same reason as get-version's checkout: the real release must be
          # cut from the branch tip get-version analyzed, or the "behind the remote" guard trips
          # whenever a [skip ci] commit raced in.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: coverage-badge
          path: coverage-artifact
      - run: mkdir -p .github/badges && mv coverage-artifact/coverage-badge.json .github/badges/coverage.json
      - id: semrel
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/exec@7.1.0
            @semantic-release/github@12.0.9
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      # Retry once for the narrow window where an out-of-band push to main landed between
      # this job's checkout and its own push (the concurrency group above already serializes
      # overlapping runs of this workflow, so this only guards against a genuinely external push).
      - if: steps.semrel.outcome == 'failure'
        name: "Diagnose before retrying (expected: an out-of-band push landed since checkout)"
        run: |
          git fetch origin main
          BEFORE_SHA="$(git rev-parse HEAD)"
          AFTER_SHA="$(git rev-parse origin/main)"
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "origin/main moved since checkout ($BEFORE_SHA -> $AFTER_SHA) - this matches the out-of-band-push race this retry is designed for."
          else
            echo "::warning::origin/main did NOT move since checkout - this failure is likely NOT the expected out-of-band-push race. Retrying anyway, but check the semantic-release log above for the real cause before assuming this is just a race."
          fi
          git checkout -B main origin/main
      - if: steps.semrel.outcome == 'failure'
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/exec@7.1.0
            @semantic-release/github@12.0.9
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
