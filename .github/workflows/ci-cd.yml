name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Test stage — runs on every push to main AND every pull request
  # ---------------------------------------------------------------------
  test-hacs-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Official HACS structural validation (hacs.json, manifest fields, etc.) - always
      # referenced by branch per HACS's own docs, since it validates against whatever
      # the current HACS requirements are, not a fixed historical ruleset.
      # ignore: brands - brand-asset submission (a one-time PR to home-assistant/brands)
      # is deliberately deferred; don't block every push on it in the meantime.
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  test-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Home Assistant Core's own manifest/config-flow/translation validator.
      - uses: home-assistant/actions/hassfest@master

  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  # ---------------------------------------------------------------------
  # Version / release — push to main only
  # ---------------------------------------------------------------------
  get-version:
    needs: [test-hacs-validation, test-hassfest, test-lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: studylife-hacs-release-chain
      cancel-in-progress: false
    # @semantic-release/github verifies push/write access as part of its plugin lifecycle
    # even during a dry run - a read-only token fails that check outright. No actual writes
    # happen here regardless of these permissions; dry_run: true never pushes/tags/releases.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: semrel
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/github
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail if no next version determined
        if: steps.semrel.outputs.new_release_published != 'true'
        run: |
          echo "::error::semantic-release did not determine a next version (no releasable commits since the last tag). Aborting instead of silently skipping."
          exit 1

  semantic-release:
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: studylife-hacs-release-chain
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - id: semrel
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/github
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      # Retry once for the narrow window where an out-of-band push to main landed between
      # this job's checkout and its own push (the concurrency group above already serializes
      # overlapping runs of this workflow, so this only guards against a genuinely external push).
      - if: steps.semrel.outcome == 'failure'
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - if: steps.semrel.outcome == 'failure'
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/github
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
