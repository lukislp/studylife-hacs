# The whole pipeline lives in lukislp/ci-workflows (hacs-ci.yml): HACS + hassfest validation,
# ruff, pytest with the coverage badge, an Atheris fuzz pass, then get-version and
# semantic-release on main. Check names in the branch ruleset are "ci / <job>".
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per PR / per branch tip: a newer push cancels the PR run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: lukislp/ci-workflows/.github/workflows/hacs-ci.yml@045f17628d155f7e56c2f6ebdbd473b31e247112 # v1.6.0
    # The called workflow narrows these per job (the test jobs run with contents: read).
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      component: studylife
      fuzz-script: fuzz/fuzz_coordinator.py
      release-group: studylife-hacs-release-chain
    secrets:
      SEMANTIC_RELEASE_DEPLOY_KEY: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
