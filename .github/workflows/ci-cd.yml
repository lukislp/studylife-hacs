# Tests and releases of the integration. The test stage lives in lukislp/ci-workflows
# (hacs-ci.yml): HACS + hassfest validation, ruff, pytest with the coverage badge artifact and an
# Atheris fuzz pass; check names in the branch ruleset are "ci / <job>". The release is not part
# of it. Instead, every push to main is looked at by the release module of the
# lktec-bot GitHub App (policy and rules: .github/lktec-bot.yml, documented in
# docs/modules/release.md of lukislp/lktec-bot). When the Conventional Commits since the highest
# v* tag warrant a release, the run
#   * lets the App create the tag v<version> together with the GitHub release and its notes
#     through the GitHub API (job release). No deploy key and no semantic-release: the tag is
#     not SSH-signed, the assets are what is signed and attested,
#   * builds studylife.zip from that commit: the content of custom_components/studylife with the
#     release version in manifest.json, which is what HACS installs (hacs.json zip_release),
#   * attaches studylife.zip with SHA256SUMS, a Sigstore keyless bundle per file
#     (*.sigstore.json) and the GitHub build provenance (studylife-<version>.intoto.jsonl), and
#     adds the verification commands to the release notes (job publish).
# No file in the repository carries the release version (manifest.json stays at 0.0.0), so a
# release makes no commit. A run whose commit is no longer the tip of main is skipped: the run
# of the newer push releases it. Never on pull requests.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per PR / per branch tip: a newer push cancels the PR run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read # the reusable release workflow looks up which commit of itself it was called at

jobs:
  ci:
    uses: lukislp/ci-workflows/.github/workflows/hacs-ci.yml@dbab0a38a1c660130a4df3976732dca5ffe789f7 # v1.10.1
    permissions:
      contents: read
    with:
      component: studylife
      fuzz-script: fuzz/fuzz_coordinator.py

  # Lays the coverage badge of the test stage out as the handover that publish-badge commits.
  badge-handover:
    needs: [ci]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badge
          path: ${{ runner.temp }}/in
      - name: Lay out the handover
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/badge-handover/files/.github/badges"
          cp "$RUNNER_TEMP/in/coverage-badge.json" "$RUNNER_TEMP/badge-handover/files/.github/badges/coverage.json"
          printf '%s\n' .github/badges/coverage.json > "$RUNNER_TEMP/badge-handover/manifest.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge-handover
          path: ${{ runner.temp }}/badge-handover
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  release:
    needs: [ci]
    if: github.event_name == 'push'
    uses: lukislp/lktec-bot/.github/workflows/release.yml@96409228fae388950b700878bfc36af519292d64 # v0.7.1
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  # Signed, verifiable release assets (OpenSSF Scorecard "Signed-Releases"): the HACS zip,
  # SHA256SUMS over it, a Sigstore keyless bundle per file and one GitHub build provenance
  # attestation, attached as studylife-<version>.intoto.jsonl.
  publish:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build studylife.zip and SHA256SUMS
        run: |
          set -eu
          python3 scripts/build_release_zip.py --version "$VERSION" --out assets/studylife.zip
          (cd assets && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" assets/SHA256SUMS
          cat assets/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-checksums: assets/SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign every asset (Sigstore keyless) and verify
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -eu
          for file in assets/*; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
            cosign verify-blob --bundle "$file.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$file"
          done
          cp "$BUNDLE" "assets/studylife-$VERSION.intoto.jsonl"
      - name: Attach the assets and complete the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          tag="v$VERSION"
          gh release view "$tag" -R "$REPOSITORY" --json tagName --jq .tagName
          gh release upload "$tag" -R "$REPOSITORY" --clobber assets/*
          gh release view "$tag" -R "$REPOSITORY" --json body --jq .body > notes.md
          {
            echo
            echo "## Install"
            echo
            echo "HACS installs \`studylife.zip\` of this release (custom repository \`https://github.com/$REPOSITORY\`, type Integration). By hand: unpack it into \`<config>/custom_components/studylife/\` and restart Home Assistant."
            echo
            echo "## Verify"
            echo
            echo "Tag \`$tag\` was created by the lktec-bot GitHub App through the GitHub API. Every file below has a Sigstore \`.sigstore.json\` bundle, \`SHA256SUMS\` lists them, and \`studylife-$VERSION.intoto.jsonl\` is their build provenance."
            echo
            echo '```bash'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "gh attestation verify studylife.zip -R $REPOSITORY"
            echo "cosign verify-blob --bundle studylife.zip.sigstore.json \\"
            echo "  --certificate-identity https://github.com/$REPOSITORY/.github/workflows/ci-cd.yml@refs/heads/main \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com studylife.zip"
            echo '```'
          } >> notes.md
          gh release edit "$tag" -R "$REPOSITORY" --notes-file notes.md
          echo "- release \`$tag\` with $(find assets -type f | wc -l) assets" >> "$GITHUB_STEP_SUMMARY"

  # Commits the coverage badge as the lktec-bot App after each release (policy: modules.sync).
  publish-badge:
    needs: [release, badge-handover]
    if: needs.release.outputs.released == 'true'
    uses: lukislp/lktec-bot/.github/workflows/sync.yml@96409228fae388950b700878bfc36af519292d64 # v0.7.1
    with:
      artifact: coverage-badge-handover
      branch: main
      version: ${{ needs.release.outputs.version }}
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}