        device:
          integration: studylife
    session_id:
      required: true
      selector:
        number:
          min: 1
          mode: box

set_course_goal:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: studylife
    course_id:
      required: true
      selector:
        number:
          min: 1
          max: 999
          mode: box
    course_name:
      required: false
      selector:
        text:
    target_date:
      required: false
      selector:
