create_session:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: studylife
    course_id:
      required: true
      selector:
        number:
          min: 1
          max: 999
          mode: box
    course_name:
      required: false
      selector:
        text:
    course_color:
      required: false
      selector:
        text:
    start_time:
      required: true
      selector:
        datetime:
    end_time:
      required: true
      selector:
        datetime:
    topic:
      required: false
      selector:
        text:
    notes:
      required: false
      selector:
        text:
          multiline: true
    timer_mode_id:
      required: false
      selector:
        number:
          min: 1
          max: 5
          mode: box

update_session:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: studylife
    session_id:
      required: true
      selector:
        number:
          min: 1
          mode: box
    course_id:
      required: false
      selector:
        number:
          min: 1
          max: 999
          mode: box
    course_name:
      required: false
      selector:
        text:
    course_color:
      required: false
      selector:
        text:
    start_time:
      required: false
      selector:
        datetime:
    end_time:
      required: false
      selector:
        datetime:
    topic:
      required: false
      selector:
        text:
    notes:
      required: false
      selector:
        text:
